<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture Note AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Lecture Note AI 🎙️</h1>
            <p>講義音声・動画を自動で要約・文字起こし</p>
        </header>

        <section class="card">
            <h2>設定</h2>
            <div class="input-group">
                <label for="api-key">Gemini API Key</label>
                <input type="password" id="api-key" placeholder="AIzaSy..." autocomplete="off">
                <p class="hint">
                    <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>
                    で無料取得できます。キーはこのブラウザ内（localStorage）にのみ保存されます。
                </p>
            </div>
            <button id="save-key-btn" class="btn btn-secondary">APIキーを保存</button>
            <p id="key-status" class="status-msg hidden" aria-live="polite"></p>
        </section>

        <section class="card">
            <h2>音声・動画入力</h2>
            <div class="input-group">
                <label for="lecture-name">講義名（任意）</label>
                <input type="text" id="lecture-name" placeholder="例：第1回 経済学入門">
            </div>
            <div class="input-group">
                <label for="audio-file">音声・動画ファイル</label>
                <input type="file" id="audio-file" accept="audio/*,video/*">
                <p class="hint">音声: mp3 / wav / m4a / aac / ogg / flac など。動画: mp4 / mov / webm など（話されている内容を解析します）。</p>
            </div>
            <div class="input-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="include-transcript" checked>
                    文字起こし全文も生成する
                </label>
                <p class="hint">オフにすると出力が要約・要点だけになり、120分など長時間の講義も一括処理しやすくなります。</p>
            </div>
            <button id="generate-btn" class="btn btn-primary">ノートを生成する</button>

            <div id="loading" class="hidden" aria-live="polite">
                <div class="spinner"></div>
                <p id="loading-text">AIが音声・動画を解析しています...</p>
            </div>
        </section>

        <section id="output-area" class="card hidden">
            <h2>生成結果</h2>

            <h3 id="output-lecture-name" class="output-lecture-name hidden"></h3>

            <p id="output-warning" class="warning-banner hidden"></p>

            <div class="export-row">
                <select id="export-format">
                    <option value="txt">テキスト (.txt)</option>
                    <option value="md">Markdown (.md)</option>
                </select>
                <button id="export-btn" class="btn btn-secondary">まとめてダウンロード</button>
            </div>

            <div class="result-box">
                <div class="result-header">
                    <h3>3行要約</h3>
                    <button class="btn-copy" data-target="summary-content">コピー</button>
                </div>
                <div id="summary-content" class="result-content"></div>
            </div>

            <div class="result-box">
                <div class="result-header">
                    <h3>要点（3〜5個）</h3>
                    <button class="btn-copy" data-target="points-content">コピー</button>
                </div>
                <div id="points-content" class="result-content"></div>
            </div>

            <div class="result-box" id="transcript-box">
                <div class="result-header">
                    <h3>文字起こし全文</h3>
                    <button class="btn-copy" data-target="transcript-content">コピー</button>
                </div>
                <div id="transcript-content" class="result-content"></div>
            </div>
        </section>
    </div>

    <script src="main.js" defer></script>
</body>
</html>
